name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: global_help_network
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements-dev.txt
      - run: |
          cat > .env <<'EOF'
          DATABASE_URL=postgresql+asyncpg://postgres:postgres@localhost:5432/global_help_network
          TEST_DATABASE_URL=postgresql+asyncpg://postgres:postgres@localhost:5432/global_help_network
          JWT_SECRET_KEY=ci-secret-change-me
          JWT_ALGORITHM=HS256
          ACCESS_TOKEN_EXPIRE_MINUTES=30
          REFRESH_TOKEN_EXPIRE_DAYS=7
          CORS_ORIGINS=http://localhost:8000
          EOF
      - run: pytest -v --cov=backend/app --cov-report=term-missing
