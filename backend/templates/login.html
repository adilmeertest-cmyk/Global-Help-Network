<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Login</title><script src="https://cdn.tailwindcss.com"></script><link rel="stylesheet" href="/static/css/app.css"></head><body class="bg-slate-50"><main class="min-h-screen grid place-items-center p-4"><form id="auth" class="card w-full max-w-md"><h1 class="text-3xl font-black mb-6">Welcome back</h1><input id="login" class="input" placeholder="Email or username" required><input id="password" type="password" class="input mt-3" placeholder="Password" required><button class="btn btn-primary w-full mt-4">Login</button><p id="error" class="error"></p><p class="text-sm mt-4">New here? <a class="link" href="/register">Create an account</a></p></form></main><script>document.querySelector('#auth').onsubmit=async e=>{e.preventDefault();const r=await fetch('/api/v1/auth/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({login:login.value,password:password.value})});const j=await r.json();if(!r.ok){error.textContent=j.detail||'Login failed';return}localStorage.setItem('access_token',j.data.access_token);localStorage.setItem('refresh_token',j.data.refresh_token);location='/'};</script></body></html>
