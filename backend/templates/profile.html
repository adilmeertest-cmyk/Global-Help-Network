<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Profile</title><script src="https://cdn.tailwindcss.com"></script><link rel="stylesheet" href="/static/css/app.css"></head><body class="bg-slate-50"><main class="max-w-3xl mx-auto p-4 md:p-8"><div id="profile" class="card"></div></main><script>const username=location.pathname.split('/').pop();fetch('/api/v1/users/'+encodeURIComponent(username)).then(r=>r.json()).then(j=>{const u=j.data;profile.innerHTML=`<h1 class="text-3xl font-black">${u.name}</h1><p class="text-slate-500">@${u.username} · ${u.city}, ${u.country}</p><p class="mt-4">${u.bio||''}</p><div class="grid grid-cols-3 gap-3 mt-6"><div><b>${u.reputation_score}</b><small> reputation</small></div><div><b>${u.helpful_answers_count}</b><small> helpful</small></div><div><b>${u.solved_requests_count}</b><small> solved</small></div></div>`});</script></body></html>
