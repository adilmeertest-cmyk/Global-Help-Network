<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Ask for help</title><script src="https://cdn.tailwindcss.com"></script><link rel="stylesheet" href="/static/css/app.css"></head><body class="bg-slate-50"><main class="max-w-2xl mx-auto p-4 md:p-8"><form id="form" class="card"><h1 class="text-3xl font-black">Ask for help</h1><p class="text-slate-500 mt-2">Tell the community what you need.</p><input id="title" class="input mt-6" placeholder="What do you need help with?" required><textarea id="description" class="input mt-3 min-h-40" placeholder="Explain your situation clearly" required></textarea><select id="category_id" class="input mt-3" required><option value="">Select category</option></select><div class="grid grid-cols-2 gap-3 mt-3"><input id="country" class="input" placeholder="Country"><input id="city" class="input" placeholder="City"></div><div class="grid grid-cols-2 gap-3 mt-3"><select id="help_type" class="input"><option>Both</option><option>Online</option><option>Local</option></select><select id="urgency" class="input"><option>Medium</option><option>Low</option><option>High</option></select></div><input id="tags" class="input mt-3" placeholder="Tags, comma separated"><button class="btn btn-primary w-full mt-5">Publish request</button><p id="error" class="error"></p></form></main><script>const h=()=>({Authorization:'Bearer '+localStorage.getItem('access_token')});fetch('/api/v1/categories').then(r=>r.json()).then(j=>category_id.innerHTML='<option value="">Select category</option>'+j.data.map(c=>`<option value="${c.id}">${c.name}</option>`).join(''));form.onsubmit=async e=>{e.preventDefault();const body={title:title.value,description:description.value,category_id:+category_id.value,country:country.value||null,city:city.value||null,help_type:help_type.value,urgency:urgency.value,tags:tags.value.split(',').map(x=>x.trim()).filter(Boolean)};const r=await fetch('/api/v1/help-requests',{method:'POST',headers:{...h(),'Content-Type':'application/json'},body:JSON.stringify(body)});const j=await r.json();if(!r.ok){error.textContent=j.detail||'Could not publish';return}location='/help-requests?request_id='+j.data.id};</script></body></html>
