<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Help Request</title><script src="https://cdn.tailwindcss.com"></script><link rel="stylesheet" href="/static/css/app.css"></head><body class="bg-slate-50"><main class="max-w-3xl mx-auto p-4 md:p-8"><div id="request" class="card"></div><section class="card mt-5"><h2 class="text-xl font-bold">Answers</h2><div id="answers" class="grid gap-3 mt-4"></div><form id="answerForm" class="mt-5 flex gap-2"><input id="content" class="input" placeholder="Share a helpful answer"><button class="btn btn-primary">Answer</button></form></section></main><script>const id=location.pathname.split('/').pop(),h=()=>({Authorization:'Bearer '+localStorage.getItem('access_token')});async function load(){let [r,a]=await Promise.all([fetch('/api/v1/help-requests/'+id),fetch('/api/v1/help-requests/'+id+'/answers')]);let j=await r.json(),x=await a.json();let q=j.data;request.innerHTML=`<span class="badge">${q.urgency}</span><h1 class="text-3xl font-black mt-3">${q.title}</h1><p class="mt-4 text-slate-700 whitespace-pre-wrap">${q.description}</p><p class="text-sm text-slate-500 mt-4">${q.city||''}, ${q.country||''} · ${q.status}</p>`;answers.innerHTML=(x.data||[]).map(v=>`<article class="border rounded-xl p-4"><p>${v.content}</p><div class="flex gap-2 mt-3"><span class="text-sm">Helpful: ${v.helpful_count}</span><button class="btn" onclick="helpful(${v.id})">Helpful</button><button class="btn" onclick="best(${v.id})">Best answer</button></div></article>`).join('')}answerForm.onsubmit=async e=>{e.preventDefault();await fetch('/api/v1/help-requests/'+id+'/answers',{method:'POST',headers:{...h(),'Content-Type':'application/json'},body:JSON.stringify({content:content.value})});content.value='';load()};async function helpful(id){await fetch('/api/v1/answers/'+id+'/helpful',{method:'POST',headers:h()});load()}async function best(id){await fetch('/api/v1/answers/'+id+'/best',{method:'PATCH',headers:h()});load()}load();</script></body></html>
