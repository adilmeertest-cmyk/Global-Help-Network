<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Messages</title><script src="https://cdn.tailwindcss.com"></script><link rel="stylesheet" href="/static/css/app.css"></head><body class="bg-slate-50"><main class="max-w-5xl mx-auto p-4 md:p-8"><h1 class="text-3xl font-black">Messages</h1><div id="conversations" class="grid gap-3 mt-6"></div></main><script>const h=()=>({Authorization:'Bearer '+localStorage.getItem('access_token')});fetch('/api/v1/conversations',{headers:h()}).then(r=>r.json()).then(j=>conversations.innerHTML=(j.data||[]).map(c=>`<div class="card"><b>Conversation #${c.id}</b><p class="text-sm text-slate-500">User ${c.other_user_id}</p><a class="link" href="/messages?conversation=${c.id}">Open thread</a></div>`).join(''));</script></body></html>
