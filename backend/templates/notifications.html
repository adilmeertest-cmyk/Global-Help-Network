<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Notifications</title><script src="https://cdn.tailwindcss.com"></script><link rel="stylesheet" href="/static/css/app.css"></head><body class="bg-slate-50"><main class="max-w-3xl mx-auto p-4 md:p-8"><div class="flex justify-between"><h1 class="text-3xl font-black">Notifications</h1><button class="btn" onclick="readAll()">Mark all read</button></div><div id="list" class="grid gap-3 mt-6"></div></main><script>const h=()=>({Authorization:'Bearer '+localStorage.getItem('access_token')});async function load(){let j=await fetch('/api/v1/notifications',{headers:h()}).then(r=>r.json());list.innerHTML=(j.data||[]).map(n=>`<button onclick="read(${n.id})" class="card text-left ${n.is_read?'':'border-indigo-300'}"><b>${n.title}</b><p class="text-slate-600">${n.body}</p></button>`).join('')}async function read(id){await fetch('/api/v1/notifications/'+id+'/read',{method:'PATCH',headers:h()});load()}async function readAll(){await fetch('/api/v1/notifications/read-all',{method:'PATCH',headers:h()});load()}load();</script></body></html>
