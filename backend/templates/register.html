<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Join Global Help Network</title><script src="https://cdn.tailwindcss.com"></script><link rel="stylesheet" href="/static/css/app.css"></head><body class="bg-slate-50"><main class="min-h-screen grid place-items-center p-4"><form id="auth" class="card w-full max-w-lg"><h1 class="text-3xl font-black mb-6">Join the network</h1><div class="grid md:grid-cols-2 gap-3"><input id="name" class="input" placeholder="Full name" required><input id="username" class="input" placeholder="Username" required><input id="email" type="email" class="input" placeholder="Email" required><input id="password" type="password" class="input" placeholder="Strong password" required><input id="country" class="input" placeholder="Country" required><input id="city" class="input" placeholder="City" required></div><button class="btn btn-primary w-full mt-4">Create account</button><p id="error" class="error"></p><p class="text-sm mt-4">Already a member? <a class="link" href="/login">Login</a></p></form></main><script>auth.onsubmit=async e=>{e.preventDefault();const data=Object.fromEntries(['name','username','email','password','country','city'].map(x=>[x,document.getElementById(x).value]));const r=await fetch('/api/v1/auth/register',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(data)});const j=await r.json();if(!r.ok){error.textContent=j.detail||JSON.stringify(j);return}localStorage.setItem('access_token',j.data.access_token);localStorage.setItem('refresh_token',j.data.refresh_token);location='/'};</script></body></html>
