<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin Dashboard</title><script src="https://cdn.tailwindcss.com"></script><link rel="stylesheet" href="/static/css/app.css"></head><body class="bg-slate-50"><main class="max-w-7xl mx-auto p-4 md:p-8"><div class="flex justify-between items-center mb-8"><div><p class="text-sm text-indigo-600 font-bold">GLOBAL HELP NETWORK</p><h1 class="text-3xl font-black">Admin dashboard</h1></div><a href="/" class="btn">Back to site</a></div><section id="stats" class="grid grid-cols-2 md:grid-cols-4 gap-4"></section><section class="card mt-8"><div class="flex gap-2"><input id="search" class="input" placeholder="Search users"><button onclick="loadUsers()" class="btn btn-primary">Search</button></div><div class="overflow-x-auto mt-5"><table class="w-full text-left"><thead><tr class="border-b"><th class="p-2">User</th><th class="p-2">Email</th><th class="p-2">Status</th><th class="p-2">Action</th></tr></thead><tbody id="users"></tbody></table></div></section></main><script>const h=()=>({'Authorization':'Bearer '+localStorage.getItem('access_token')});async function load(){let r=await fetch('/api/v1/admin/dashboard/stats',{headers:h()});let j=await r.json();if(!r.ok){document.body.innerHTML='<main class="p-8">Admin access required.</main>';return}stats.innerHTML=Object.entries(j.data).map(([k,v])=>`<div class="card"><div class="text-2xl font-black">${v}</div><div class="text-xs text-slate-500 mt-1">${k.replaceAll('_',' ')}</div></div>`).join('');loadUsers()}async function loadUsers(){let r=await fetch('/api/v1/admin/users?search='+encodeURIComponent(search.value),{headers:h()});let j=await r.json();users.innerHTML=(j.data||[]).map(u=>`<tr class="border-b"><td class="p-2 font-semibold">${u.username}</td><td class="p-2">${u.email}</td><td class="p-2">${u.account_status}</td><td class="p-2"><select onchange="status(${u.id},this.value)" class="input"><option>${u.account_status}</option><option value="active">active</option><option value="suspended">suspended</option><option value="banned">banned</option></select></td></tr>`).join('')}async function status(id,s){await fetch('/api/v1/admin/users/'+id+'/status',{method:'PATCH',headers:{...h(),'Content-Type':'application/json'},body:JSON.stringify({status:s})});load()}load();</script></body></html>
