<!doctype html><html><head><meta name="viewport" content="width=device-width,initial-scale=1"><script src="https://cdn.tailwindcss.com"></script></head><body class="bg-slate-50"><main class="max-w-3xl mx-auto p-6"><div id="p" class="bg-white rounded-2xl p-6"></div></main><script>const u=new URLSearchParams(location.search).get('username');fetch('/api/v1/users/'+encodeURIComponent(u||'' )).then(r=>r.json()).then(j=>{let x=j.data;p.innerHTML=`<h1 class="text-3xl font-black">${x.name}</h1><p>@${x.username} · ${x.city}, ${x.country}</p><p class="mt-4">${x.bio||''}</p><div class="mt-6">Reputation: <b>${x.reputation_score}</b> · Helpful: <b>${x.helpful_answers_count}</b> · Solved: <b>${x.solved_requests_count}</b></div>`})</script></body></html>
