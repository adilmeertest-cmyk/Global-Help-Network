<!doctype html><html><head><meta name="viewport" content="width=device-width,initial-scale=1"><script src="https://cdn.tailwindcss.com"></script></head><body class="bg-slate-50"><main class="max-w-4xl mx-auto p-6"><h1 class="text-3xl font-black">Messages</h1><div id="list" class="grid gap-3 mt-6"></div></main><script>fetch('/api/v1/conversations',{headers:{Authorization:'Bearer '+localStorage.access_token}}).then(r=>r.json()).then(j=>list.innerHTML=(j.data||[]).map(x=>`<div class="bg-white rounded-2xl p-4">Conversation #${x.id} · User ${x.other_user_id}</div>`).join(''))</script></body></html>
