<!doctype html><html><head><meta name="viewport" content="width=device-width,initial-scale=1"><script src="https://cdn.tailwindcss.com"></script></head><body class="bg-slate-50"><main class="max-w-6xl mx-auto p-6"><h1 class="text-3xl font-black">Admin Dashboard</h1><div id="stats" class="grid grid-cols-2 md:grid-cols-4 gap-3 mt-6"></div><div class="bg-white rounded-2xl p-5 mt-6"><h2 class="font-bold">Users</h2><div id="users"></div></div></main><script>const h={Authorization:'Bearer '+localStorage.access_token};Promise.all([fetch('/api/v1/admin/dashboard/stats',{headers:h}),fetch('/api/v1/admin/users',{headers:h})]).then(async([a,b])=>{let s=await a.json(),u=await b.json();stats.innerHTML=Object.entries(s.data||{}).map(([k,v])=>`<div class="bg-white p-4 rounded-xl"><b>${v}</b><small>${k}</small></div>`).join('');users.innerHTML=(u.data||[]).map(x=>`<div class="border-b py-2">${x.username} — ${x.account_status}</div>`).join('')})</script></body></html>
