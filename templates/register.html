<!doctype html><html><head><meta name="viewport" content="width=device-width,initial-scale=1"><script src="https://cdn.tailwindcss.com"></script></head><body class="bg-slate-50"><main class="min-h-screen grid place-items-center p-4"><form id="f" class="bg-white p-6 rounded-2xl shadow w-full max-w-lg"><h1 class="text-3xl font-black mb-4">Join Global Help Network</h1><div class="grid md:grid-cols-2 gap-3"> <input id="name" class="border p-3 rounded-xl" placeholder="Name" required><input id="username" class="border p-3 rounded-xl" placeholder="Username" required><input id="email" class="border p-3 rounded-xl" placeholder="Email" required><input id="password" type="password" class="border p-3 rounded-xl" placeholder="Strong password" required><input id="country" class="border p-3 rounded-xl" placeholder="Country" required><input id="city" class="border p-3 rounded-xl" placeholder="City" required></div><button class="bg-indigo-600 text-white p-3 rounded-xl w-full mt-4">Create account</button><p id="e" class="text-red-600 mt-3"></p></form></main><script>f.onsubmit=async x=>{x.preventDefault();let d=Object.fromEntries(['name','username','email','password','country','city'].map(k=>[k,document.getElementById(k).value]));let r=await fetch('/api/v1/auth/register',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(d)}),j=await r.json();if(!r.ok){e.textContent=j.detail;return}localStorage.access_token=j.data.access_token;localStorage.refresh_token=j.data.refresh_token;location='/'}</script></body></html>
