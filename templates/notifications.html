<!doctype html><html><head><meta name="viewport" content="width=device-width,initial-scale=1"><script src="https://cdn.tailwindcss.com"></script></head><body class="bg-slate-50"><main class="max-w-3xl mx-auto p-6"><div class="flex justify-between"><h1 class="text-3xl font-black">Notifications</h1><button onclick="allRead()" class="bg-indigo-600 text-white px-4 py-2 rounded-xl">Read all</button></div><div id="list" class="grid gap-3 mt-6"></div></main><script>const h={Authorization:'Bearer '+localStorage.access_token};async function load(){let j=await fetch('/api/v1/notifications',{headers:h}).then(r=>r.json());list.innerHTML=(j.data||[]).map(n=>`<div class="bg-white rounded-2xl p-4"><b>${n.title}</b><p>${n.body}</p></div>`).join('')}async function allRead(){await fetch('/api/v1/notifications/read-all',{method:'PATCH',headers:h});load()}load()</script></body></html>
