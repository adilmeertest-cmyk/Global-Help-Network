<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Global Help Network</title><script src="https://cdn.tailwindcss.com"></script></head><body class="bg-slate-50"><nav class="bg-white border-b sticky top-0 z-10"><div class="max-w-6xl mx-auto px-4 h-16 flex items-center justify-between"><a href="/" class="font-black text-xl">🌍 Global Help Network</a><div class="flex gap-2"><a class="px-4 py-2 border rounded-xl" href="/login">Login</a><a class="px-4 py-2 rounded-xl bg-indigo-600 text-white" href="/register">Join</a></div></div></nav><main class="max-w-6xl mx-auto px-4 py-8"><p class="text-sm font-semibold text-indigo-600">ASK → HELP → SOLVE → TRUST</p><h1 class="text-4xl font-black mt-2">People helping people.</h1><p class="text-slate-600 mt-2">Find a request you can solve or ask your community for help.</p><div class="flex flex-wrap gap-2 my-6"><button class="tab active px-4 py-2 rounded-full bg-indigo-600 text-white" data-mode="newest">Newest</button><button class="tab px-4 py-2 rounded-full bg-white border" data-mode="unanswered">Unanswered</button><button class="tab px-4 py-2 rounded-full bg-white border" data-mode="nearby">Nearby</button><a class="px-4 py-2 rounded-full bg-indigo-600 text-white" href="/help-requests/new">Ask for help</a></div><section id="feed" class="grid gap-4"></section><button id="more" class="px-4 py-2 rounded-xl bg-white border hidden mt-6">Load more</button></main><script>const token=()=>localStorage.getItem('access_token');let mode='newest',page=1;const esc=s=>String(s||'').replace(/[&<>\"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',"'":'&#39;'}[c]));async function load(reset=true){if(reset){page=1;feed.innerHTML='<div class="bg-white p-5 rounded-2xl">Loading…</div>'}let r=await fetch(`/api/v1/feed?mode=${mode}&page=${page}`,{headers:token()?{Authorization:'Bearer '+token()}:{}}),j=await r.json();if(!r.ok){feed.innerHTML='<div class="bg-white p-5 rounded-2xl">Unable to load feed.</div>';return}if(reset)feed.innerHTML='';if(!j.data.length&&page===1)feed.innerHTML='<div class="bg-white p-5 rounded-2xl">No requests yet. Be the first to ask.</div>';j.data.forEach(q=>feed.insertAdjacentHTML('beforeend',`<article class="bg-white border rounded-2xl p-5 shadow-sm"><div class="flex justify-between"><span class="text-xs font-bold text-indigo-700 bg-indigo-50 px-2 py-1 rounded-full">${esc(q.urgency)}</span><span class="text-xs text-slate-500">${esc(q.status)}</span></div><h2 class="text-xl font-extrabold mt-3"><a class="hover:text-indigo-600" href="/help-requests?request_id=${q.id}">${esc(q.title)}</a></h2><p class="text-slate-600 mt-2">${esc(q.description)}</p><p class="text-sm text-slate-500 mt-4">${esc(q.author?.name||'Member')} · ${esc(q.city)}, ${esc(q.country)}</p></article>`));more.classList.toggle('hidden',page>=j.meta.pages)}document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));b.classList.add('active');mode=b.dataset.mode;load()});more.onclick=()=>{page++;load(false)};load();</script></body></html>
