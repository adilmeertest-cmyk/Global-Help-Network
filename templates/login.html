<!doctype html><html><head><meta name="viewport" content="width=device-width,initial-scale=1"><script src="https://cdn.tailwindcss.com"></script></head><body class="bg-slate-50"><main class="min-h-screen grid place-items-center p-4"><form id="f" class="bg-white p-6 rounded-2xl shadow w-full max-w-md"><h1 class="text-3xl font-black mb-4">Login</h1><input id="login" class="border p-3 rounded-xl w-full" placeholder="Email or username" required><input id="password" type="password" class="border p-3 rounded-xl w-full mt-3" placeholder="Password" required><button class="bg-indigo-600 text-white p-3 rounded-xl w-full mt-4">Login</button><p id="e" class="text-red-600 mt-3"></p></form></main><script>f.onsubmit=async x=>{x.preventDefault();let r=await fetch('/api/v1/auth/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({login:login.value,password:password.value})}),j=await r.json();if(!r.ok){e.textContent=j.detail;return}localStorage.access_token=j.data.access_token;localStorage.refresh_token=j.data.refresh_token;location='/'}</script></body></html>
