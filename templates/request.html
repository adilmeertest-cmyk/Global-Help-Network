<!doctype html><html><head><meta name="viewport" content="width=device-width,initial-scale=1"><script src="https://cdn.tailwindcss.com"></script></head><body class="bg-slate-50"><main class="max-w-3xl mx-auto p-6"><div id="q" class="bg-white rounded-2xl p-6"></div><div class="bg-white rounded-2xl p-6 mt-4"><h2 class="font-bold">Answers</h2><div id="answers" class="grid gap-3 mt-3"></div><form id="f" class="flex gap-2 mt-4"><input id="content" class="border p-3 rounded-xl flex-1" placeholder="Your answer"><button class="bg-indigo-600 text-white px-4 rounded-xl">Answer</button></form></div></main><script>const id=new URLSearchParams(location.search).get('request_id'),h={Authorization:'Bearer '+localStorage.access_token};async function load(){let [a,b]=await Promise.all([fetch('/api/v1/help-requests/'+id),fetch('/api/v1/help-requests/'+id+'/answers')]);let x=await a.json(),y=await b.json();q.innerHTML=`<span class="text-indigo-600 font-bold">${x.data.urgency}</span><h1 class="text-3xl font-black mt-2">${x.data.title}</h1><p class="mt-4">${x.data.description}</p><p class="text-slate-500 mt-3">${x.data.city||''}, ${x.data.country||''} · ${x.data.status}</p>`;answers.innerHTML=(y.data||[]).map(v=>`<div class="border rounded-xl p-4">${v.content}<div class="text-sm mt-2">Helpful: ${v.helpful_count}</div></div>`).join('')}f.onsubmit=async e=>{e.preventDefault();await fetch('/api/v1/help-requests/'+id+'/answers',{method:'POST',headers:{...h,'Content-Type':'application/json'},body:JSON.stringify({content:content.value})});content.value='';load()};if(id)load()</script></body></html>
