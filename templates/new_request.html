<!doctype html><html><head><meta name="viewport" content="width=device-width,initial-scale=1"><script src="https://cdn.tailwindcss.com"></script></head><body class="bg-slate-50"><main class="max-w-2xl mx-auto p-6"><form id="f" class="bg-white rounded-2xl p-6"><h1 class="text-3xl font-black">Ask for help</h1><input id="title" class="border p-3 rounded-xl w-full mt-5" placeholder="Title" required><textarea id="description" class="border p-3 rounded-xl w-full mt-3 min-h-40" placeholder="Describe your need" required></textarea><select id="category_id" class="border p-3 rounded-xl w-full mt-3" required></select><div class="grid grid-cols-2 gap-3 mt-3"><input id="country" class="border p-3 rounded-xl" placeholder="Country"><input id="city" class="border p-3 rounded-xl" placeholder="City"></div><button class="bg-indigo-600 text-white p-3 rounded-xl w-full mt-4">Publish</button><p id="e" class="text-red-600 mt-3"></p></form></main><script>const h={Authorization:'Bearer '+localStorage.access_token};fetch('/api/v1/categories').then(r=>r.json()).then(j=>category_id.innerHTML='<option value="">Category</option>'+j.data.map(c=>`<option value="${c.id}">${c.name}</option>`).join(''));f.onsubmit=async e=>{e.preventDefault();let body={title:title.value,description:description.value,category_id:+category_id.value,country:country.value||null,city:city.value||null,help_type:'Both',urgency:'Medium',tags:[]};let r=await fetch('/api/v1/help-requests',{method:'POST',headers:{...h,'Content-Type':'application/json'},body:JSON.stringify(body)}),j=await r.json();if(!r.ok){e.textContent=j.detail;return}location='/help-requests?request_id='+j.data.id}</script></body></html>
